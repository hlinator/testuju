<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1633">
<title>Ondra ✈️ Mája</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a1633;color:#ffd6e0;font:600 1.2rem system-ui,sans-serif;text-align:center;padding:20px}</style>
</head>
<body>
<p id="m">Načítám… ♥️</p>
<script>
// Aplikace je uložená v soukromém úložišti a vydá se jen s osobním klíčem z odkazu.
let k = new URLSearchParams(location.search).get("k");
try { if (k) localStorage.setItem("odpocet-k", k); else k = localStorage.getItem("odpocet-k"); } catch (e) {}
const m = document.getElementById("m");
if (!k) m.textContent = "Pro zobrazení otevři svůj osobní odkaz 💌";
else fetch("/api/file?p=index.html&k=" + encodeURIComponent(k), { cache: "no-store" })
  .then(r => { if (r.status === 403) throw new Error("klic"); if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(t => { document.open(); document.write(t); document.close(); })
  .catch(e => { if (e.message === "klic") try { localStorage.removeItem("odpocet-k"); } catch (x) {}
    m.textContent = e.message === "klic" ? "Tenhle odkaz neznám — otevři svůj osobní odkaz 💌" : "Nepodařilo se načíst — zkus obnovit stránku ♥️"; });
</script>
</body>
</html>
